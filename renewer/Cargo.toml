[package]
name = "katabump-renewer"
version = "0.1.0"
edition = "2021"
description = "Automatically renews servers on the Katabump control panel"
license = "ISC"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thirtyfour = "0.34"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
